name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify repository
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          echo "Repository checkout and basic smoke test passed."